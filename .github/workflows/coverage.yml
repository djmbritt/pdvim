# Runs the tests with coverage turned on after each push to main and on
# every pull request, through coverage.sh, as on a machine of one's own.
# The table of how much of each file the tests reach goes in the run's
# summary, and the report to browse line by line is kept as the run's
# artifact, "coverage". The run fails when the tests reach less of the
# lines than the floor below; raise it as coverage grows, a point or so
# under what is measured here, as it differs a little from run to run.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The least share of the lines, in percent, the tests may reach.
  COVERAGE_FLOOR: 90

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MuPDF is compiled from source, and its bindings are made with
      # bindgen, which needs libclang.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      # The table goes in the summary, and the report is kept, even when
      # coverage is under the floor, to see where it fell.
      - name: Measure
        run: |
          status=0
          ./coverage.sh --fail-under "$COVERAGE_FLOOR" > coverage.md || status=$?
          {
            echo "## Test coverage"
            echo
            cat coverage.md
            echo
            echo "The floor is ${COVERAGE_FLOOR}% of the lines."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage.md
            target/coverage/html
