# pdvim's built-in configuration: every setting and key binding at its
# default. pdvim is built with this file inside it and reads it first.
#
# To change something, copy this file to ~/.config/pdvim/config.toml (or
# $XDG_CONFIG_HOME/pdvim/) and edit it. You only need the entries you
# change: anything left out keeps its default here. pdvim reads your file
# when it starts.

[settings]

# Recolor pages for a dark background: true, false, or "auto" to follow
# the system's light or dark theme, as the desktop's color-scheme setting
# says. With "auto", every document is recolored while the system is dark
# and shown as printed while it is light, changing as the system does;
# R still turns recoloring on or off for the document in view until the
# system changes again. With true or false, recolor and trim apply to
# documents opened for the first time; after that, each document is
# restored the way you left it.
recolor = "auto"

# Hide the blank margins of pages.
trim = false

# The theme: the colors of the tab bar, the status bar, the lists and the
# backdrop behind the pages, and the colors pages are recolored in. "auto"
# follows the system's light or dark theme, using theme-dark while it is
# dark and theme-light while it is light. The themes are pdvim-dark,
# pdvim-light, catppuccin-latte (light), catppuccin-frappe,
# catppuccin-macchiato and catppuccin-mocha.
theme = "auto"
theme-dark = "catppuccin-mocha"
theme-light = "catppuccin-latte"

# The color white paper becomes when recolored, as #rrggbb, or "theme" for
# the theme's background color.
recolor-lightcolor = "theme"

# The color black ink becomes when recolored, as #rrggbb, or "theme" for
# the theme's text color.
recolor-darkcolor = "theme"

# How far one press of `j` or `k` scrolls, in pixels.
scroll-step = 40

# Ask "quit pdvim? (y/n)" before quitting: when the last tab is closed,
# with :qa, or when the window is closed. Press y to quit, any other key to
# stay. Closing the window again while asked quits without asking.
confirm-quit = true

# Ask "close tab ...? (y/n)" before closing a tab with q, :q or :tabclose
# while other tabs are open. Closing the last tab quits, so confirm-quit
# decides about that.
confirm-tab-close = true

# Save highlights into the PDF as soon as they are made or taken back.
# Off, they stay in pdvim until :w saves them (:w copy.pdf saves a copy
# instead), and pdvim asks before closing a document with unsaved ones.
autosave = false

# The colors text is marked in from visual mode: H highlights, U
# underlines, S strikes out, W underlines with a squiggle. Markings are
# saved into the PDF file, so other readers show them too.
highlight-color = "#ffff00"
underline-color = "#1e88e5"
strikeout-color = "#e53935"
squiggly-color = "#fb8c00"
note-color = "#fdd835"

# Key bindings come one table to a mode. Each binds keys to an action by
# name, or to "none" to remove a default. The same can be done while
# running with :map, :unmap and :mapclear, naming the mode first for any
# but normal: ":map visual Y yank".
#
# A key is a single character ("j", "G", "?") or a name: space, tab, escape,
# enter, backspace, up, down, left, right, pageup, pagedown, home, end.
# Put ctrl+ or shift+ in front for modifiers: "ctrl+d", "shift+space",
# "shift+tab", "ctrl+shift+tab". "shift+q" is the same as "Q".
#
# Separate the keys of a sequence with spaces: "g g". If one binding is the
# start of a longer one, the shorter one wins.
#
# :help lists every action of every mode, with the keys bound to it now.

[keys.normal]

# Reading. A count typed before the keys is passed on: 5j scrolls five
# times, and with one, first-page and last-page go to that page, zoom-to
# zooms to that percentage, and next-tab goes to that tab.

# Scrolling
"j" = "scroll-down"
"down" = "scroll-down"
"k" = "scroll-up"
"up" = "scroll-up"
"h" = "scroll-left"
"left" = "scroll-left"
"l" = "scroll-right"
"right" = "scroll-right"
"ctrl+d" = "scroll-half-down"
"ctrl+u" = "scroll-half-up"
"ctrl+f" = "scroll-full-down"
"space" = "scroll-full-down"
"ctrl+b" = "scroll-full-up"
"shift+space" = "scroll-full-up"

# Pages
"J" = "next-page"
"pagedown" = "next-page"
"K" = "previous-page"
"pageup" = "previous-page"
"g g" = "first-page"
"home" = "first-page"
"G" = "last-page"
"end" = "last-page"
"H" = "page-top"
"L" = "page-bottom"
# The table of contents, in a sidebar: j/k to move, l/h to open and close
# a chapter's sections, enter to go there
"tab" = "outline"
# The start of the next or previous chapter or section in it
"] ]" = "next-chapter"
"[ [" = "previous-chapter"

# Zoom and view
"+" = "zoom-in"
"z i" = "zoom-in"
"z I" = "zoom-in"
"-" = "zoom-out"
"z o" = "zoom-out"
"z O" = "zoom-out"
"=" = "zoom-to"
"z z" = "zoom-to"
"z Z" = "zoom-to"
"z 0" = "zoom-reset"
"s" = "fit-width"
"z w" = "fit-width"
"z p" = "fit-page"
"r" = "rotate"
"R" = "toggle-recolor"
"t" = "toggle-trim"

# Search and prompts
"/" = "search-forward"
"?" = "search-backward"
"n" = "search-next"
"N" = "search-previous"
":" = "command-prompt"
"o" = "recent"
# "help" lists every action and the keys bound to it, like :help. It has no
# key by default; give it one with, for example:
# "ctrl+h" = "help"

# Links: label every link in view, then type a label's two letters to
# follow it
"f" = "follow-link"

# Selecting text: label every line in view, type a label to start there,
# move with h j k l, w b e, 0 $, and press y to copy
"v" = "visual"
"V" = "visual-line"

# Highlights and other markings: go to the next or previous one, take away
# the one gone to, or list them all in a sidebar. u takes back the last
# marking made or taken away, and ctrl+r puts it back.
"] h" = "next-marking"
"[ h" = "previous-marking"
"g h" = "label-markings"
"d" = "delete-marking"
"c" = "change-note"
"shift+tab" = "markings"
"u" = "undo"
"ctrl+r" = "redo"
# Save them into the file, like :w
"ctrl+s" = "write"

# Marks and jumps. m then a letter marks the place: a to z in this
# document, A to Z in any, kept across restarts. ` or ' then the letter goes
# back to it; `` goes back to where the last jump left from. A jump is gg,
# G, a search, a chapter, a link or a mark; ctrl+o goes back through them
# and ctrl+i forward again.
"m" = "set-mark"
"`" = "go-to-mark"
"'" = "go-to-mark"
"ctrl+o" = "jump-back"
"ctrl+i" = "jump-forward"

# Tabs
"g t" = "next-tab"
"ctrl+tab" = "next-tab"
"g T" = "previous-tab"
"ctrl+shift+tab" = "previous-tab"

# What the document says about itself: title, author, dates and more
"ctrl+g" = "info"

# Cancel a half-typed command and hide search highlights
"escape" = "abort"
"ctrl+c" = "abort"
"ctrl+[" = "abort"

# Close the tab, and quit after the last one
"q" = "quit"

[keys.visual]

# Selecting text, after v or V and a line's label. A count moves that many
# times: 3w, 2fe.
"y" = "yank"
"H" = "highlight"
"U" = "underline"
"S" = "strike-out"
"W" = "squiggly"
"d" = "unmark"
"n" = "note"
"c" = "change-note"
"escape" = "leave"
"ctrl+c" = "leave"
"ctrl+[" = "leave"
"o" = "other-end"
"v" = "characters"
"V" = "lines"
"j" = "down"
"down" = "down"
"k" = "up"
"up" = "up"
"h" = "left"
"left" = "left"
"l" = "right"
"right" = "right"
"0" = "line-start"
"home" = "line-start"
"^" = "line-text"
"$" = "line-end"
"end" = "line-end"
"w" = "next-word"
"b" = "previous-word"
"e" = "word-end"
# These take the character to look for as the next key typed.
"f" = "find-forward"
"F" = "find-backward"
"t" = "till-forward"
"T" = "till-backward"
";" = "repeat-find"
"," = "repeat-find-reversed"

[keys.hints]

# The labels shown on links (f) and lines (v, V). Letters not bound here
# type a label.
"escape" = "cancel"
"ctrl+c" = "cancel"
"ctrl+[" = "cancel"
"backspace" = "back"
"ctrl+h" = "back"

[keys.outline]

# The table of contents (tab).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+d" = "half-down"
"pagedown" = "half-down"
"ctrl+u" = "half-up"
"pageup" = "half-up"
"g g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"enter" = "go"
"l" = "open"
"right" = "open"
"space" = "toggle"
"h" = "fold"
"left" = "fold"
"q" = "close"
"tab" = "close"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.markings]

# The highlights and other markings (shift+tab).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+d" = "half-down"
"pagedown" = "half-down"
"ctrl+u" = "half-up"
"pageup" = "half-up"
"g g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"enter" = "go"
"l" = "go"
"d" = "delete"
"x" = "delete"
"c" = "change"
"q" = "close"
"shift+tab" = "close"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.recent]

# The list of recent documents (o). A digit not bound here opens that
