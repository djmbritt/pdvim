# pdvim's built-in configuration: every setting and key binding at its
# default. pdvim is built with this file inside it and reads it first.
#
# To change something, copy this file to ~/.config/pdvim/config.toml (or
# $XDG_CONFIG_HOME/pdvim/) and edit it. You only need the entries you
# change: anything left out keeps its default here. pdvim reads your file
# when it starts, and again with :source.

[settings]

# Recolor pages for a dark background: true, false, or "auto" to follow
# the system's light or dark theme, as the desktop's color-scheme setting
# says. With "auto", every document is recolored while the system is dark
# and shown as printed while it is light, changing as the system does;
# R still turns recoloring on or off for the document in view until the
# system changes again. With true or false, recolor and trim apply to
# documents opened for the first time; after that, each document is
# restored the way you left it.
recolor = "auto"

# Hide the blank margins of pages. Each page is then enlarged to be as
# wide as the widest, so that every page fills the window's width alike,
# up to twice its size, so a page with little on it, such as a title, is
# not blown up.
trim = false

# The theme: the colors of the tab bar, the status bar, the lists and the
# backdrop behind the pages, and the colors pages are recolored in. "auto"
# follows the system's light or dark theme, using theme-dark while it is
# dark and theme-light while it is light. The themes are pdvim-dark,
# pdvim-light, catppuccin-latte (light), catppuccin-frappe,
# catppuccin-macchiato and catppuccin-mocha.
theme = "auto"
theme-dark = "catppuccin-mocha"
theme-light = "catppuccin-latte"

# The color white paper becomes when recolored, as #rrggbb, or "theme" for
# the theme's background color.
recolor-lightcolor = "theme"

# The color black ink becomes when recolored, as #rrggbb, or "theme" for
# the theme's text color.
recolor-darkcolor = "theme"

# How far one press of `j` or `k` scrolls, in pixels.
scroll-step = 40

# How fast the mouse wheel and touchpad scroll, times their usual speed: 2
# is twice as fast, 0.5 half. A notch of the wheel is three scroll steps.
# Above 0 and up to 20.
wheel-speed = 1.0

# The size of type, in points, that books without pages of their own (EPUB,
# FB2) are laid out in, on pages the size of the window. From 4 to 72. In a
# book, the zoom keys (+, -, =) make the type bigger or smaller instead.
fontsize = 12

# How many pages sit side by side in a document not opened before, from 1
# to 4: 2 shows two-page spreads, and lays books out in two columns, each
# half the window wide. z c and :set columns change only the tab in view,
# and each document remembers its own.
columns = 1

# How pages show: "continuous", every page in a column to scroll through,
# side by side as columns says; "single", one page at a time; or "double",
# two facing pages at a time, after the first page alone, as a printed book
# has them. A page or two at a time, scrolling past the bottom of the page
# turns to the next, and past its top to the one before. z m goes from one
# to the next, for every tab.
page-mode = "continuous"

# Draw a thin line round every page, in the theme's border color. z f
# turns it on or off.
page-borders = false

# Ask "quit pdvim? (y/n)" before quitting: when the last tab is closed,
# with :qa, or when the window is closed. Press y to quit, any other key to
# stay. Closing the window again while asked quits without asking.
confirm-quit = true

# Ask "close tab ...? (y/n)" before closing a tab with q, :q or :tabclose
# while other tabs are open. Closing the last tab quits, so confirm-quit
# decides about that.
confirm-tab-close = true

# Save highlights into the PDF as soon as they are made or taken back.
# Off, they stay in pdvim until :w saves them (:w copy.pdf saves a copy
# instead), and pdvim asks before closing a document with unsaved ones.
autosave = false

# Open the tabs left open when pdvim was last quit, the one in view in view
# again, when it starts without a file, as a vim session; off, it lists the
# documents read lately instead.
session = false

# The letters the labels on links and lines are made of, the first ones
# used most; more of the alphabet is added when there are too many links
# for two letters to label. Lower-case letters or digits, each once.
hintchars = "asdfghjkl"

# Highlight the matches in view while a search is typed after / or ?.
incsearch = true

# Make a search match case when it has a capital letter in it, as vim's
# smartcase: /pdf finds PDF and pdf, /PDF only PDF. * and # in visual mode
# find any case, as in vim.
smartcase = true

# Show the tab bar along the top when more than one tab is open.
tabbar = true

# Show the status bar along the bottom while reading. Off, it shows only
# while there is something to say or type: a prompt, a message, a key
# sequence half typed, or a mode other than NORMAL; it then lies over the
# bottom of the pages, which stay put. z b hides or shows both bars.
statusbar = true

# The colors text is marked in from visual mode: H highlights, U
# underlines, S strikes out, W underlines with a squiggle. Markings are
# saved into the PDF file, so other readers show them too.
highlight-color = "#ffff00"
underline-color = "#1e88e5"
strikeout-color = "#e53935"
squiggly-color = "#fb8c00"
note-color = "#fdd835"

# Settings for the documents under some paths only, a [[paths]] table
# each: a pattern under match, and any of recolor, trim and columns. They
# set how a matching document looks each time it opens; the last rule to
# match wins. In a pattern, * is any characters but /, ? is one, ** is any
# characters at all; one ending in / is everything under that folder, and
# one without a / is matched against the file's name alone.
#
# [[paths]]
# match = "~/scans/**"
# recolor = false
# trim = true
#
# [[paths]]
# match = "*.cbz"
# columns = 2

# Key bindings come one table to a mode. Each binds keys to an action by
# name, or to "none" to remove a default. The same can be done while
# running with :map, :unmap and :mapclear, naming the mode first for any
# but normal: ":map visual Y yank".
#
# A key is a single character ("j", "G", "?") or a name: space, tab, escape,
# enter, backspace, up, down, left, right, pageup, pagedown, home, end,
# f1 to f12.
# Put ctrl+ or shift+ in front for modifiers: "ctrl+d", "shift+space",
# "shift+tab", "ctrl+shift+tab". "shift+q" is the same as "Q".
#
# Separate the keys of a sequence with spaces: "g g". If one binding is the
# start of a longer one, the shorter one wins.
#
# In normal mode, keys can also run a command line, written after a colon;
# a semicolon separates several commands, which run in turn:
# "ctrl+t" = ":theme catppuccin-latte"
# "g x" = ":set recolor false; zoom-to 150"
#
# :help lists every action of every mode, with the keys bound to it now.

[keys.normal]

# Reading. A count typed before the keys is passed on: 5j scrolls five
# times, and with one, first-page and last-page go to that page, zoom-to
# zooms to that percentage, and next-tab goes to that tab.

# Scrolling
"j" = "scroll-down"
"down" = "scroll-down"
"k" = "scroll-up"
"up" = "scroll-up"
"h" = "scroll-left"
"left" = "scroll-left"
"l" = "scroll-right"
"right" = "scroll-right"
"ctrl+d" = "scroll-half-down"
"ctrl+u" = "scroll-half-up"
"ctrl+f" = "scroll-full-down"
"space" = "scroll-full-down"
"ctrl+b" = "scroll-full-up"
"shift+space" = "scroll-full-up"

# Pages
"J" = "next-page"
"pagedown" = "next-page"
"K" = "previous-page"
"pageup" = "previous-page"
"g g" = "first-page"
"home" = "first-page"
"G" = "last-page"
"%" = "percent"
"end" = "last-page"
"H" = "page-top"
"L" = "page-bottom"
# The table of contents, in a sidebar: j/k to move, l/h to open and close
# a chapter's sections, enter to go there
"tab" = "outline"
# Every page small, side by side: move to one and press enter to read there
"g o" = "overview"
# The start of the next or previous chapter or section in it
"] ]" = "next-chapter"
"[ [" = "previous-chapter"

# Zoom and view
"+" = "zoom-in"
"z i" = "zoom-in"
"z I" = "zoom-in"
"-" = "zoom-out"
"z o" = "zoom-out"
"z O" = "zoom-out"
"=" = "zoom-to"
"z z" = "zoom-to"
"z Z" = "zoom-to"
"z 0" = "zoom-reset"
"z w" = "fit-width"
"z p" = "fit-page"
"r" = "rotate"
"R" = "toggle-recolor"
"t" = "toggle-trim"
# Hide the tab bar and status bar while reading, or show them again
"z b" = "toggle-bars"
"z c" = "toggle-columns"
"z m" = "cycle-page-mode"
"z f" = "toggle-borders"
"f11" = "toggle-fullscreen"

# Search and prompts
"/" = "search-forward"
"?" = "search-backward"
"n" = "search-next"
"N" = "search-previous"
"g /" = "matches"
":" = "command-prompt"
# Run the last command line again, typed after : or bound to keys
"." = "repeat"
"o" = "recent"
# "help" lists every action and the keys bound to it, like :help. It has no
# key by default; give it one with, for example:
# "ctrl+h" = "help"

# Links: label every link in view, and every highlight and note, then type
# a label's two letters to follow the link or pick the marking
"f" = "follow-link"
# Label the links only: F opens the place a link goes to in a new tab, and
# ; y copies where a link goes. After any of these, / then some of a
# link's text narrows the labels to the links that hold it
"F" = "follow-link-tab"
"; y" = "yank-link"
# Forms: go to the first or last field in view to fill it in, or back to
# the one last gone to; tab goes on to the next field, and shift+tab back
"g i" = "first-field"
"g I" = "last-field"
"g ;" = "field-again"

# Selecting text: label every line in view, type a label to start there,
# move with h j k l, w b e, 0 $, and press y to copy
"v" = "visual"
"g v" = "select-again"
"V" = "visual-line"
# As flash.nvim's s: type some of the text in view, and each match gets a
# label; type a label to start selecting there, or enter for the nearest
"s" = "flash"

# Highlights and other markings: go to the next or previous one, take away
# the one gone to, or list them all in a sidebar. u takes back the last
# marking made or taken away, and ctrl+r puts it back.
"] h" = "next-marking"
"[ h" = "previous-marking"
"g h" = "label-markings"
"d" = "delete-marking"
"c" = "change-note"
"y h" = "yank-marking"
"shift+tab" = "markings"
"u" = "undo"
"ctrl+r" = "redo"
# Save them into the file, like :w
"ctrl+s" = "write"

# Marks and jumps. m then a letter marks the place: a to z in this
# document, A to Z in any, kept across restarts. ` or ' then the letter goes
# back to it; `` goes back to where the last jump left from. A jump is gg,
# G, a search, a chapter, a link or a mark; ctrl+o goes back through them
# and ctrl+i forward again.
"m" = "set-mark"
"`" = "go-to-mark"
"'" = "go-to-mark"
"ctrl+o" = "jump-back"
"ctrl+i" = "jump-forward"

# Tabs. b lists them: type to narrow the list, enter to go to one
"b" = "tabs"
"g t" = "next-tab"
"ctrl+tab" = "next-tab"
"g T" = "previous-tab"
"ctrl+shift+tab" = "previous-tab"
# Open the tab closed last again, in its place; with a count, that many
"U" = "reopen-tab"

# Copy the path of the document's file, its title, or the text of the page
# in view; or label the pictures and figures in view, to copy one as a
# picture
"y y" = "yank-path"
"y t" = "yank-title"
"y p" = "yank-page"
"y i" = "yank-picture"

# What the document says about itself: title, author, dates and more
"ctrl+g" = "info"

# Cancel a half-typed command and hide search highlights
"escape" = "abort"
"ctrl+c" = "abort"
"ctrl+[" = "abort"

# Close the tab, and quit after the last one
"q" = "quit"

[keys.visual]

# Selecting text, after v or V and a line's label. A count moves that many
# times: 3w, 2fe.
"y" = "yank"
"H" = "highlight"
"U" = "underline"
"S" = "strike-out"
"W" = "squiggly"
"d" = "unmark"
"n" = "note"
"c" = "change-note"
"escape" = "leave"
"ctrl+c" = "leave"
"ctrl+[" = "leave"
"o" = "other-end"
# Type some of the text in view, then a match's label, to move there
"s" = "flash"
"v" = "characters"
"V" = "lines"
"j" = "down"
"down" = "down"
"k" = "up"
"up" = "up"
"h" = "left"
"left" = "left"
"l" = "right"
"right" = "right"
"0" = "line-start"
"home" = "line-start"
"^" = "line-text"
"$" = "line-end"
"end" = "line-end"
"w" = "next-word"
"b" = "previous-word"
"e" = "word-end"
# These take the character to look for as the next key typed.
"f" = "find-forward"
"F" = "find-backward"
"t" = "till-forward"
"T" = "till-backward"
";" = "repeat-find"
"," = "repeat-find-reversed"
"i p" = "inner-paragraph"
"a p" = "around-paragraph"
"i w" = "inner-word"
"a w" = "around-word"
"i s" = "inner-sentence"
"a s" = "around-sentence"
"*" = "search-selection"
"#" = "search-selection-back"

[keys.hints]

# The labels shown on links (f) and lines (v, V). Letters not bound here
# type a label.
"escape" = "cancel"
"ctrl+c" = "cancel"
"ctrl+[" = "cancel"
"backspace" = "back"
"ctrl+h" = "back"
# Then type some of a link's text to label only the links that hold it;
# enter picks the only one left, or lets you type a label
"/" = "filter"

[keys.overview]

# Every page small, side by side (g o): move with the keys you read with,
# and enter reads from the page selected.
"j" = "down"
"down" = "down"
"k" = "up"
"up" = "up"
"h" = "left"
"left" = "left"
"l" = "right"
"right" = "right"
"ctrl+d" = "screen-down"
"pagedown" = "screen-down"
"ctrl+u" = "screen-up"
"pageup" = "screen-up"
"g g" = "first"
"home" = "first"
"G" = "last"
"end" = "last"
"enter" = "go"
"escape" = "close"
"ctrl+c" = "close"
"q" = "close"
"g o" = "close"

[keys.outline]

# The table of contents (tab).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+d" = "half-down"
"pagedown" = "half-down"
"ctrl+u" = "half-up"
"pageup" = "half-up"
"g g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"enter" = "go"
"l" = "open"
"right" = "open"
"space" = "toggle"
"h" = "fold"
"left" = "fold"
"q" = "close"
"tab" = "close"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.markings]

# The highlights and other markings (shift+tab).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+d" = "half-down"
"pagedown" = "half-down"
"ctrl+u" = "half-up"
"pageup" = "half-up"
"g g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"enter" = "go"
"l" = "go"
"d" = "delete"
"x" = "delete"
"c" = "change"
"q" = "close"
"shift+tab" = "close"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.recent]

# The lists of recent documents (o) and open tabs (b). Keys not bound here
# type, and the list narrows to the entries that hold every word typed.
"down" = "down"
"ctrl+n" = "down"
"ctrl+j" = "down"
"tab" = "down"
"up" = "up"
"ctrl+p" = "up"
"ctrl+k" = "up"
"shift+tab" = "up"
"home" = "top"
"end" = "bottom"
"enter" = "open"
"backspace" = "rub-out"
"ctrl+h" = "rub-out"
"ctrl+u" = "clear-line"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.help]

# The list of key bindings (:help).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"ctrl+e" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+y" = "up"
"ctrl+d" = "half-down"
"ctrl+u" = "half-up"
"space" = "page-down"
"ctrl+f" = "page-down"
"pagedown" = "page-down"
"shift+space" = "page-up"
"ctrl+b" = "page-up"
"pageup" = "page-up"
"g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"q" = "close"
"escape" = "close"
"enter" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.prompt]

# Typing after :, / or ?. Keys not bound here type themselves.
"enter" = "submit"
"escape" = "cancel"
"ctrl+c" = "cancel"
"ctrl+[" = "cancel"
"backspace" = "rub-out"
"ctrl+h" = "rub-out"
"ctrl+w" = "rub-out-word"
"ctrl+u" = "clear-line"
"tab" = "complete"
"shift+tab" = "complete-previous"
# ctrl+shift+v pastes too
"ctrl+v" = "paste"
# Earlier commands, or earlier searches; what is typed already narrows them.
"up" = "older"
"ctrl+p" = "older"
"down" = "newer"
"ctrl+n" = "newer"

[keys.confirm]

# Questions, such as "quit pdvim? (y/n)". Any key not bound here is no,
# escape among them.
"y" = "yes"
"Y" = "yes"
"enter" = "yes"
