"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"ctrl+j" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+k" = "up"
"g g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"enter" = "open"
"l" = "open"
"o" = "open"
"right" = "open"
"q" = "close"
"escape" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.help]

# The list of key bindings (:help).
"j" = "down"
"down" = "down"
"ctrl+n" = "down"
"ctrl+e" = "down"
"k" = "up"
"up" = "up"
"ctrl+p" = "up"
"ctrl+y" = "up"
"ctrl+d" = "half-down"
"ctrl+u" = "half-up"
"space" = "page-down"
"ctrl+f" = "page-down"
"pagedown" = "page-down"
"shift+space" = "page-up"
"ctrl+b" = "page-up"
"pageup" = "page-up"
"g" = "top"
"home" = "top"
"G" = "bottom"
"end" = "bottom"
"q" = "close"
"escape" = "close"
"enter" = "close"
"ctrl+c" = "close"
"ctrl+[" = "close"

[keys.prompt]

# Typing after :, / or ?. Keys not bound here type themselves.
"enter" = "submit"
"escape" = "cancel"
"ctrl+c" = "cancel"
"ctrl+[" = "cancel"
"backspace" = "rub-out"
"ctrl+h" = "rub-out"
"ctrl+w" = "rub-out-word"
"ctrl+u" = "clear-line"
"tab" = "complete"
"shift+tab" = "complete-previous"
# ctrl+shift+v pastes too
"ctrl+v" = "paste"

[keys.confirm]

# Questions, such as "quit pdvim? (y/n)". Any key not bound here is no,
# escape among them.
"y" = "yes"
"Y" = "yes"
"enter" = "yes"
