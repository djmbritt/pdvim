[package]
name = "pdvim"
version = "0.2.19"
edition = "2024"
# The oldest Rust that builds pdvim and the locked versions of its crates.
rust-version = "1.90"
description = "A minimal, keyboard-driven PDF reader"
license = "AGPL-3.0-or-later"
repository = "https://github.com/djmbritt/pdvim"

[dependencies]
# The clipboard, for pictures, which iced's holds only text of: see
# src/clipboard.rs.
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
# Fonts installed on the system, for what documents lack: see src/fonts.rs.
font-kit = "0.14.3"
iced = { version = "0.14.0", features = ["canvas", "image"] }
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "epub", "html", "cbz", "img", "xps", "svg"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "preserve_order"] }

# For `cargo deb`, which the release workflow runs to make the .deb.
[package.metadata.deb]
maintainer = "David Britt"
section = "graphics"
extended-description = "A minimal, keyboard-driven PDF reader with vi keybindings, tabs, search, visual mode and highlights."
depends = "$auto"
assets = [
    ["target/release/pdvim", "usr/bin/", "755"],
    ["packaging/pdvim.desktop", "usr/share/applications/", "644"],
    ["packaging/pdvim.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/pdvim/", "644"],
    ["defaults.toml", "usr/share/doc/pdvim/", "644"],
    ["docs/man/pdvim.1", "usr/share/man/man1/", "644"],
    ["docs/man/pdvim.5", "usr/share/man/man5/", "644"],
]

# For `cargo generate-rpm`, which the release workflow runs to make the
# .rpm. Under --target, target/release/ is read as target/TARGET/release/.
# The libraries pdvim links to are found in the binary and required.
[package.metadata.generate-rpm]
summary = "A minimal, keyboard-driven PDF reader"
assets = [
    { source = "target/release/pdvim", dest = "/usr/bin/pdvim", mode = "755" },
    { source = "packaging/pdvim.desktop", dest = "/usr/share/applications/pdvim.desktop", mode = "644" },
    { source = "packaging/pdvim.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pdvim.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/pdvim/README.md", mode = "644", doc = true },
    { source = "defaults.toml", dest = "/usr/share/doc/pdvim/defaults.toml", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/pdvim/LICENSE", mode = "644", doc = true },
    { source = "docs/man/pdvim.1", dest = "/usr/share/man/man1/pdvim.1", mode = "644", doc = true },
    { source = "docs/man/pdvim.5", dest = "/usr/share/man/man5/pdvim.5", mode = "644", doc = true },
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# DEBUGGING LEFT IN
dbg_macro = "deny"
use_debug = "deny"
print_stdout = "deny"
print_stderr = "deny"
# ERRORS THROWN AWAY
get_unwrap = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
let_underscore_untyped = "deny"
mem_forget = "deny"
infinite_loop = "deny"
# A NEW VARIANT IS NEVER CAUGHT BY _ UNSEEN
wildcard_enum_match_arm = "deny"
# EXPECT, WITH A REASON, RATHER THAN ALLOW
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# TESTS THAT SAY WHAT BROKE
missing_assert_message = "deny"
assertions_on_result_states = "deny"
tests_outside_test_module = "deny"
# PLAINER CODE
if_then_some_else_none = "deny"
str_to_string = "deny"
string_add = "deny"
format_push_string = "deny"
verbose_file_reads = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
unneeded_field_pattern = "deny"
create_dir = "deny"
large_include_file = "deny"
iter_over_hash_type = "deny"
# NUMBERS
lossy_float_literal = "deny"
decimal_literal_representation = "deny"
unseparated_literal_suffix = "deny"
suspicious_xor_used_as_pow = "deny"

[dev-dependencies]
# Times the hot paths: `cargo bench`, with the benchmarks in benches/. The
# reports to browse go in target/criterion/.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }
# Runs the tasks the app returns in its tests, as the runtime would: see
# src/app/testing.rs. The same version as iced's own.
iced_runtime = "0.14.0"
# Draws the window in the tests, with tiny-skia and no screen: see
# src/app/drawing.rs, and .cargo/config.toml for why tiny-skia.
iced_test = "0.14.0"

[[bench]]
name = "hot_paths"
harness = false

# The renderer the tests draw the window with, so slow unoptimised that
# drawing once takes a second, rather than a sixth of one.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3
