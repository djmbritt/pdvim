# Builds pdvim for Linux, macOS and Windows, and attaches the packages to a
# draft GitHub release.
#
# Push a tag to make a release: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in Cargo.toml. Run it by hand from the
# Actions tab to build and test the packages without releasing them; they
# are kept as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu still offered, so that the program runs on
          # distributions with an older glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, deb: true }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          # Arm Linux runners are free only for public repositories. Once
          # this one is public, add:
          # - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, deb: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # MuPDF is compiled from source, and its bindings are made with
      # bindgen, which needs libclang.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig1-dev pkg-config
      - name: Install packaging tools (macOS)
        if: runner.os == 'macOS'
        run: brew install librsvg
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: packaging/dist.sh ${{ matrix.target }}

      - name: Package as .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pdvim-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "pdvim ${GITHUB_REF_NAME#v}"
