# Builds pdvim as an AppImage and as a Flatpak bundle, for Linux on x86-64
# and on 64-bit Arm, each on a runner of that architecture.
#
# The release workflow runs this for each tag, and attaches both to the
# draft release with the other packages. Run it by hand from the Actions
# tab to build and try them without releasing; they are kept as the run's
# artifacts.
#
#   AppImage  chmod +x pdvim-VERSION-ARCH.AppImage && ./pdvim-VERSION-ARCH.AppImage
#   Flatpak   flatpak install --user pdvim-VERSION-ARCH.flatpak
#
# where ARCH is x86_64 or aarch64.
#
# The Flatpak bundle needs the freedesktop runtime from Flathub, which
# `flatpak install` fetches when the Flathub remote is set up.
name: Linux bundles

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    # The oldest Ubuntu still offered, so that the AppImage runs on
    # distributions with an older glibc.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-22.04 }
          - { arch: aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4

      # MuPDF is compiled from source, and its bindings are made with
      # bindgen, which needs libclang.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-gnu
      - name: Package
        run: packaging/appimage.sh ${{ matrix.arch }}-unknown-linux-gnu
      - name: Check it starts
        run: dist/pdvim-*.AppImage --appimage-extract-and-run --version

      - uses: actions/upload-artifact@v4
        with:
          name: pdvim-appimage-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    # The freedesktop SDK, flatpak and flatpak-builder, as Flathub builds.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # The runner's own Android SDK and .NET, mounted to be cleared: the
      # SDK, LLVM and the build of MuPDF otherwise fill its disk. The Arm
      # runner may have neither, and then the mounts are left empty.
      options: >-
        --privileged
        -v /usr/local/lib/android:/runner/android
        -v /usr/share/dotnet:/runner/dotnet
    steps:
      - name: Make room
        run: |
          rm -rf /runner/android/* /runner/dotnet/*
          df -h /
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      # The build has no network, so every crate in Cargo.lock is fetched
      # beforehand, as the manifest's sources.
      - name: List the crates
        run: |
          python3 -m venv /tmp/generator
          /tmp/generator/bin/pip install --quiet aiohttp PyYAML tomlkit
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          /tmp/generator/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock \
            -o packaging/flatpak/cargo-sources.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.djmbritt.pdvim.yml
          bundle: pdvim-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          # The action builds for x86-64 unless told otherwise.
          arch: ${{ matrix.arch }}
          upload-artifact: false
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/upload-artifact@v4
        with:
          name: pdvim-flatpak-${{ matrix.arch }}
          path: pdvim-*.flatpak
          if-no-files-found: error
